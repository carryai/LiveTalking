###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
# l/r are audio-frame strides (20 ms each) around the video frame being
# generated. l is left context (startup cost only); r is FUTURE audio the
# pipeline must wait for before it can emit a frame, so it is pure latency.
# 10/10 = 200 ms each. r=5 trades some Wav2Lip context for ~100 ms less
# end-to-end delay; the 16-frame mel window still spans 200 ms of speech.
l: 10
m: 8
r: 5

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
# inference() blocks until batch_size*2 audio chunks (40 ms of audio each)
# are queued, so this is also a latency knob: 8 → 320 ms of audio buffered
# per batch, 4 → 160 ms. The ANE runs at ~100 fps, so 4 still leaves ~2x
# headroom over the 25 fps playback rate.
batch_size: 4

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: ''                   # voice name or reference audio file path (wav, 16kHz, mono)
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: dashscope        # dashscope / orcarouter
llm_model: ''                  # model override, empty = provider default (qwen-plus / orcarouter/auto)

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
